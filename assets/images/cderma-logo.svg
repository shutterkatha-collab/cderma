<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 120" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap');
      .cderma-text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 55px;
        letter-spacing: -0.025em;
        fill: #000000;
      }
      .cderma-sub {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13.5px;
        letter-spacing: 0.03em;
        fill: #000000;
      }
      .cderma-arc-outer {
        stroke: #000000;
        stroke-width: 8.5;
        stroke-linecap: round;
      }
      .cderma-arc-inner {
        stroke: #000000;
        stroke-width: 6;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Outer Stylized C Arc -->
  <path class="cderma-arc-outer" d="M 85 33 A 40 40 0 1 0 85 87" />

  <!-- Inner Concentric C Arc -->
  <path class="cderma-arc-inner" d="M 74 43.5 A 24.5 24.5 0 1 0 74 76.5" />

  <!-- Wordmark 'derma' -->
  <text class="cderma-text" x="98" y="75">derma</text>

  <!-- Subtitle 'Choice by Professional' -->
  <text class="cderma-sub" x="100" y="96">Choice by Professional</text>
</svg>
