<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDerma Nepal — CMS Administration Login</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="CDerma Nepal CMS Administration Login Portal.">
  <meta property="og:title" content="CDerma Nepal — CMS Login">
  <meta property="og:description" content="CDerma Nepal CMS Administration Login">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#1E2322',
            secondary: '#3D5A50',
            tertiary: '#5A7B6F',
            surface: '#FAF9F6',
            'surface-container': '#F4F6F4',
            'outline-border': '#E4E7E4'
          },
          fontFamily: {
            serif: ['Playfair Display', 'serif'],
            sans: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface text-primary font-sans min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-xl shadow-[0_12px_40px_rgba(30,35,34,0.06)] border border-outline-border p-8 sm:p-10">
    <div class="text-center mb-8">
      <div class="inline-flex justify-center mb-4">
        <img src="/assets/images/cderma-logo.png" alt="CDerma Choice by Professional" class="h-10 w-auto object-contain">
      </div>
      <h1 class="font-serif text-2xl font-semibold text-primary">Administration Portal</h1>
      <p class="text-xs uppercase tracking-widest text-secondary mt-1 font-semibold">Content & Formulary Governance</p>
    </div>

    <div id="errorBanner" class="hidden mb-6 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-xs flex items-center gap-2">
      <span class="material-symbols-outlined text-sm">error</span>
      <span id="errorMessage">Invalid credentials</span>
    </div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-xs uppercase tracking-wider font-semibold text-primary/70 mb-1.5" for="username">Username</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg">person</span>
          <input type="text" id="username" name="username" required
            class="w-full pl-10 pr-3 py-2.5 rounded-lg border border-outline-border bg-surface text-sm focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all"
            placeholder="Enter username" autocomplete="username">
        </div>
      </div>

      <div>
        <label class="block text-xs uppercase tracking-wider font-semibold text-primary/70 mb-1.5" for="password">Password</label>
        <div class="relative">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-lg">lock</span>
          <input type="password" id="password" name="password" required
            class="w-full pl-10 pr-3 py-2.5 rounded-lg border border-outline-border bg-surface text-sm focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-all"
            placeholder="••••••••••••" autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="submitBtn"
        class="w-full py-3 px-4 rounded-lg bg-primary hover:bg-secondary text-surface text-xs font-semibold uppercase tracking-wider transition-colors duration-200 shadow flex items-center justify-center gap-2">
        <span>Authenticate & Access CMS</span>
        <span class="material-symbols-outlined text-base">arrow_forward</span>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-outline-border text-center">
      <p class="text-[11px] text-gray-400">CDerma Nepal • K&K Trading Concern<br>Hostinger Production Management Portal</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errorBanner = document.getElementById('errorBanner');
    const errorMessage = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = data.redirect || '/admin';
        } else {
          errorMessage.textContent = data.message || 'Login failed';
          errorBanner.classList.remove('hidden');
        }
      } catch (err) {
        errorMessage.textContent = 'Server connection error. Please try again.';
        errorBanner.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75');
      }
    });
  </script>
</body>
</html>
